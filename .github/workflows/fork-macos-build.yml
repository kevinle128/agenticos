name: Fork macOS build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'kevinle128/agenticos'
    runs-on: [self-hosted, macOS, ARM64, agenticos]
    environment: desktop-signing
    timeout-minutes: 90
    steps:
      - name: Wait for the mini build lock
        run: |
          set -euo pipefail
          lock="$HOME/.mini-desktop-build.lock"
          ready="$RUNNER_TEMP/mini-build-lock.pid"
          rm -f "$ready"
          # shellcheck disable=SC2016
          nohup /usr/bin/lockf -k -t 3600 "$lock" /bin/sh -c 'echo $$ > "$1"; exec sleep 21600' sh "$ready" \
            > /dev/null 2>&1 &
          holder=$!
          for _ in $(seq 3600); do
            [[ -s "$ready" ]] && break
            kill -0 "$holder" 2> /dev/null || { echo "::error::Gave up waiting for the mini build lock after 1 hour"; exit 1; }
            sleep 1
          done
          [[ -s "$ready" ]] || { echo "::error::The mini build lock was not taken"; exit 1; }
          echo "MINI_BUILD_LOCK_PID_FILE=$ready" >> "$GITHUB_ENV"

      - name: Check free disk space
        run: |
          set -euo pipefail
          min_gib=25
          free_gib=$(( $(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}') / 1024 / 1024 ))
          echo "Free space for the workspace: ${free_gib} GiB (need ${min_gib} GiB)."
          if (( free_gib < min_gib )); then
            echo "::error::Only ${free_gib} GiB free on the mini; a desktop build needs ${min_gib} GiB"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Rust and Bun
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.bun/bin:/opt/homebrew/bin:$PATH"
          if ! "$HOME/.cargo/bin/rustup" --version >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          rustup default stable
          rustup target add aarch64-apple-darwin
          bun --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Save the keychain settings
        run: |
          security list-keychains -d user | tr -d '"' | xargs -n1 > "$RUNNER_TEMP/keychain-search-list.txt"
          security default-keychain -d user | tr -d '" ' > "$RUNNER_TEMP/keychain-default.txt"

      - name: Add the Developer ID G2 certificate authority
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL --retry 3 -o "$cert" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $cert" | shasum -a 256 -c -
          keychain="$RUNNER_TEMP/developer-id-ca.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security add-certificates -k "$keychain" "$cert"
          # shellcheck disable=SC2046
          security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychain-search-list.txt") "$keychain"

      - name: Build the signed macOS app
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/private_keys"
          (umask 077 && mkdir -p "$key_dir")
          export APPLE_API_KEY_PATH="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          (umask 077 && printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH")
          export APPLE_API_KEY="$APPLE_API_KEY_ID"
          unset APPLE_API_KEY_P8_BASE64
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          Path(os.environ["RUNNER_TEMP"], "no-updater.json").write_text(json.dumps({
              "bundle": {"createUpdaterArtifacts": False, "targets": ["app", "dmg"]}
          }) + "\n")
          PY
          bun install --frozen-lockfile
          bunx tauri build --target aarch64-apple-darwin \
            --config src-tauri/tauri.release.conf.json \
            --config "$RUNNER_TEMP/no-updater.json" \
            -- --locked

      - name: Verify the signature
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app=$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app' -type d | head -1)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          team="$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          [[ "$team" == "$APPLE_TEAM_ID" ]] || { echo "::error::The app is not signed by the APPLE_TEAM_ID team"; exit 1; }
          spctl -a -vvv -t exec "$app"
          dmg=$(find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)
          test -n "$dmg"
          xcrun stapler validate "$app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          echo "DMG_PATH=$dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agenticos-macos-arm64
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Release the mini build lock and keychains
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${MINI_BUILD_LOCK_PID_FILE:-}" && -s "$MINI_BUILD_LOCK_PID_FILE" ]]; then
            kill "$(cat "$MINI_BUILD_LOCK_PID_FILE")" 2>/dev/null || true
            rm -f "$MINI_BUILD_LOCK_PID_FILE"
          fi
          if [[ -f "$RUNNER_TEMP/keychain-search-list.txt" ]]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychain-search-list.txt") || true
          fi
          if [[ -f "$RUNNER_TEMP/keychain-default.txt" ]]; then
            security default-keychain -d user -s "$(cat "$RUNNER_TEMP/keychain-default.txt")" || true
          fi
          security delete-keychain "$RUNNER_TEMP/developer-id-ca.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys"
